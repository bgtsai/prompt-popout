<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Popout Converter</title>
<style>
  :root { --bg:#fafafa; --fg:#1f1f1f; --muted:#666; --card:#fff; --border:#ddd; --accent:#d97757; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e1e; --fg:#eee; --muted:#aaa; --card:#2a2a2a; --border:#444; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:680px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p.note { color:var(--muted); margin:0 0 16px; }
  button { font:inherit; height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  #out { white-space:pre-wrap; font-size:15px; }
  .err { color:#d0302f; }
  .tag { display:inline-block; border-radius:999px; padding:2px 12px; margin:2px; background:#7071fc; color:#fff; }
</style>
</head>
<body>
<main>
  <h1 data-t="title"></h1>
  <p class="note" data-t="note"></p>
  <div class="row">
    <input type="file" id="file" accept=".json,application/json">
    <button id="go" disabled data-t="go"></button>
  </div>
  <div id="out"></div>
</main>
<script>
(function () {
  'use strict';
  var DEFAULT_BG = '#7071fc';
  var DEFAULT_FG = '#ffffff';
  // 介面語言跟腳本一致：瀏覽器語言是中文就顯示繁中，其他一律英文，不提供切換
  var I18N = {
    zh: {
      title: 'Prompt Popout 轉檔工具',
      note: '把舊工具匯出的 JSON 轉成 Prompt Popout 可匯入的格式。全程在本機處理，不連網。',
      go: '轉換並下載',
      untitled: '(無標題)',
      notArray: '檔案內容不是 JSON 陣列',
      badJson: '不是有效的 JSON',
      readFail: '讀檔失敗',
      failed: '轉換失敗：',
      converted: function (n) { return '轉換了 ' + n + ' 筆提示詞'; },
      skipped: function (n) { return '略過 ' + n + ' 筆（缺少內容）'; },
      tags: function (n) { return '建立了 ' + n + ' 個標籤' + (n ? '：' : ''); },
      next: '接著到 Prompt Popout 的「管理…」→「匯入」選擇剛下載的檔案。'
    },
    en: {
      title: 'Prompt Popout converter',
      note: 'Converts a JSON export from the old tool into a file Prompt Popout can import. Runs entirely offline.',
      go: 'Convert & download',
      untitled: '(Untitled)',
      notArray: 'The file is not a JSON array',
      badJson: 'Not valid JSON',
      readFail: 'Could not read the file',
      failed: 'Conversion failed: ',
      converted: function (n) { return 'Converted ' + n + ' prompt(s)'; },
      skipped: function (n) { return 'Skipped ' + n + ' (no content)'; },
      tags: function (n) { return 'Created ' + n + ' tag(s)' + (n ? ':' : ''); },
      next: 'Then in Prompt Popout open Manage… → Import and pick the downloaded file.'
    }
  };
  var ZH = /^zh/i.test(navigator.language || '');
  var T = ZH ? I18N.zh : I18N.en;
  document.documentElement.lang = ZH ? 'zh-TW' : 'en';
  document.title = T.title;
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = T[el.getAttribute('data-t')]; });
  var UNTITLED = T.untitled;
  var fileIn = document.getElementById('file');
  var goBtn = document.getElementById('go');
  var out = document.getElementById('out');

  function newId() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    var buf = new Uint8Array(16);
    crypto.getRandomValues(buf);
    return Array.prototype.map.call(buf, function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
  }

  // 舊格式 → 新格式；只保留規格列出的欄位，其他（如 usageCount）捨棄
  function convert(old) {
    if (!Array.isArray(old)) throw new Error(T.notArray);
    var tags = [];
    var byLower = {};
    var prompts = [];
    var skipped = 0;
    old.forEach(function (item) {
      if (!item || typeof item !== 'object' || typeof item.text !== 'string') { skipped++; return; }
      var tagIds = [];
      (Array.isArray(item.tags) ? item.tags : []).forEach(function (name) {
        if (typeof name !== 'string') return;
        var n = name.trim();
        if (!n) return;
        var key = n.toLowerCase(); // 不分大小寫去重
        if (!byLower[key]) {
          byLower[key] = { id: newId(), name: n, bg: DEFAULT_BG, fg: DEFAULT_FG };
          tags.push(byLower[key]);
        }
        if (tagIds.indexOf(byLower[key].id) < 0) tagIds.push(byLower[key].id);
      });
      var title = typeof item.title === 'string' ? item.title.trim() : '';
      prompts.push({
        id: newId(),
        title: title || UNTITLED,
        text: item.text,
        fill: !!item.usePlaceholders,
        autoSend: !!item.autoExecute,
        tagIds: tagIds
      });
    });
    return { data: { format: 'prompt-popout', version: 1, tags: tags, prompts: prompts }, skipped: skipped };
  }

  function download(obj) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'prompt-popout_import.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // 用 DOM API 顯示結果，使用者資料一律以 textContent 寫入，免跳脫問題
  function showResult(res) {
    out.textContent = '';
    out.className = '';
    var p = res.data.prompts.length, t = res.data.tags;
    out.appendChild(document.createTextNode(
      T.converted(p) + (res.skipped ? '\n' + T.skipped(res.skipped) : '') + '\n' + T.tags(t.length) + '\n'));
    t.forEach(function (tag) {
      var s = document.createElement('span');
      s.className = 'tag';
      s.textContent = tag.name;
      out.appendChild(s);
    });
    out.appendChild(document.createTextNode('\n\n' + T.next));
  }

  function showError(msg) {
    out.className = 'err';
    out.textContent = T.failed + msg;
  }

  fileIn.addEventListener('change', function () {
    goBtn.disabled = !(fileIn.files && fileIn.files[0]);
    out.textContent = '';
  });

  goBtn.addEventListener('click', function () {
    var f = fileIn.files && fileIn.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var json;
        try { json = JSON.parse(reader.result); } catch (e) { throw new Error(T.badJson); }
        var res = convert(json);
        download(res.data);
        showResult(res);
      } catch (e) {
        console.error('[PromptPopout]', e);
        showError(e.message || String(e));
      }
    };
    reader.onerror = function () {
      console.error('[PromptPopout]', reader.error);
      showError(T.readFail);
    };
    reader.readAsText(f, 'utf-8');
  });
})();
</script>
</body>
</html>
